<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aeaskerov</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            /* border: 1px solid rgb(8, 239, 24); */
        }
        html, body {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .main {
            display: flex;
            flex: 0.7;
            flex-direction: column;
            font-size: 5vh;
            height: 90vh;
            align-items: center;
            text-align: center;
            border: 2px solid rgb(8, 239, 24);
            border-radius: 15px;
            overflow-y: auto;
            padding-bottom: 2vh;
        }
        .profile {
            display: flex;
            margin-top: 2vh;
            /* border: 2px solid rgb(8, 239, 24); */
            margin-left: 2vh;
            margin-right: 2vh;
            background: linear-gradient(
                135deg,
                #3c0774,
                #06317c,
                #0e4453,
                #54297f
            );
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
        .profile .avatar {
            flex: 0.2;
            font-size: 10vh;
            margin: 2vh;
        }
        .profile .info {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content:space-evenly;
            padding: 0 2vh;
            border-left: 5px solid rgb(0, 0, 0);
            text-align: start;
        }
        .profile .info .name {
            font-style: italic;
        }
        .education {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 2vh;
            /* border: 2px solid rgb(8, 239, 24); */
            width: 90%;
        }
        .education p {
            flex: 0.4;
            margin: 2vh 0;
        }
        .accounts {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 2vh;
            width: 50%;
            /* border: 2px solid rgb(8, 239, 24); */
        }
        .accounts p {
            flex: 0.3;
            margin: 2vh 0;
            border-radius: 10px;
            transition: background-color 0.5s;
        }
        .accounts p a {
            text-decoration: none;
            color: white;
            transition: color 0.5s;
        }
        .accounts p:hover {
            background-color: rgb(23, 218, 36);
            border-radius: 10px;
        }
        .accounts p a:hover {
            color: dodgerblue;
        }
        hr {
            border: 1px dashed rgb(8, 239, 24);
        }
        @media (width <= 900px) {
            .education, .accounts {
                flex-direction: column;
            }
        }
        @media (width <= 600px) {
            .profile {
                flex-direction: column;
            }
            .profile .info {
                border-left: none;
                border-top: 5px solid rgb(0, 0, 0);
                text-align: center;
                padding: 2vh 2vh;
            }
            .city {
                margin-top: 2vh;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="profile">
            <p class="avatar">🧐</p>
            <div class="info">
                <p class="name">Aleksandr Askerov</p>
                <p class="city">Moscow</p>
            </div>
        </div>
        <div class="education">
            <p>BSc in Applied Informatics at RUDN<br>(2022-2026)</p>
            <hr>
            <p>MSc in Applied Mathematics and Informatics at RUDN<br>(2026-2028)</p>
        </div>
        <div class="accounts">
            <p><a href="https://aeaskerov.github.io">Website</a></p>
            <hr>
            <p><a href="https://github.com/aeaskerov">GitHub</a></p>
            <hr>
            <p><a href="https://orcid.org/0009-0001-7688-2527">ORCID</a></p>
        </div>
    </div>
</body>
</html>
