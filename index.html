<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aeaskerov</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            /* border: 1px solid rgb(8, 239, 24); */
        }
        html, body {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .main {
            position: relative;
            display: flex;
            flex: 0.8;
            flex-direction: column;
            font-size: 4vh;
            height: 90vh;
            align-items: center;
            text-align: center;
            /* border: 2px solid rgb(8, 239, 24); */
            border-radius: 15px;
            overflow-y: auto;
            padding-bottom: 2vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url("https://upload.wikimedia.org/wikipedia/commons/a/a2/M81_M82_Garland_Galaxy.png");
            background-size: cover;
            /* background-position: center; */
            background-repeat: no-repeat;
        }
        .main > * {
            margin-bottom: 4vh;
        }
        .profile {
            display: flex;
            margin-top: 2vh;
            /* border: 2px solid rgb(8, 239, 24); */
            border-radius: 15px;
            margin-left: 2vh;
            margin-right: 2vh;
            background: linear-gradient(
                135deg,
                #6a11c9,
                #06317c,
                #108e9f,
                #d543a2
            );
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
        .profile .avatar {
            flex: 0.2;
            font-size: 10vh;
            align-self: center;
            padding: 2vh 2vh;
        }
        .profile .info {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content:space-evenly;
            padding: 1vh 2vh;
            border-left: 5px solid rgb(0, 0, 0);
            text-align: start;
        }
        .profile .info .name {
            font-style: italic;
        }
        .location {
            /* margin-top: 2vh; */
            font-size: 3vh;
        }
        .education {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            /* margin-top: 2vh; */
            /* border: 2px solid rgb(8, 239, 24); */
            width: 90%;
        }
        .education p {
            flex: 0.4;
            margin: 2vh 0;
        }
        .accounts {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 2vh;
            width: 50%;
            /* border: 2px solid rgb(8, 239, 24); */
        }
        .accounts p {
            flex: 0.3;
            margin: 2vh 0;
            border-radius: 10px;
            transition: background-color 0.5s;
        }
        .accounts p a {
            text-decoration: none;
            color: white;
            transition: color 0.5s;
        }
        .accounts p:hover {
            background-color: rgb(23, 218, 36);
            border-radius: 10px;
        }
        hr {
            border: 1px dashed rgb(8, 239, 24);
        }
        .credit {
            position: absolute;
            right: 10px;
            bottom: 10px;
            font-size: 1.5vh;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 9px;
            border-radius: 4px;
            margin-bottom: 0;
        }
        .credit a {
            color: white;
        }
        @media (width <= 900px) {
            .education, .accounts {
                flex-direction: column;
            }
        }
        @media (width <= 600px) {
            .profile {
                flex-direction: column;
            }
            .profile .info {
                border-left: none;
                border-top: 5px solid rgb(0, 0, 0);
                text-align: center;
                padding: 2vh 2vh;
            }
            .location {
                margin-top: 2vh;
            }
            .credit {
                position: sticky;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="profile">
            <p class="avatar">👨🏼‍🔬</p>
            <div class="info">
                <p class="name">Aleksandr Askerov</p>
                <p class="location">Planet Earth; 55.755833, 37.617778; UTC+3</p>
            </div>
        </div>
        <div class="education">
            <p>BSc in Applied Informatics at RUDN<br>(2022-2026)</p>
            <hr>
            <p>MSc in Applied Mathematics and Informatics at RUDN<br>(2026-2028)</p>
        </div>
        <div class="accounts">
            <p><a href="https://aeaskerov.github.io">Website</a></p>
            <hr>
            <p><a href="https://github.com/aeaskerov">GitHub</a></p>
            <hr>
            <p><a href="https://orcid.org/0009-0001-7688-2527">ORCID</a></p>
        </div>
        <div class="credit">
    Background image by
    <a href="https://commons.wikimedia.org/wiki/User:Cpayoub">
      Chuck Ayoub
    </a>
    —
    <a href="https://creativecommons.org/publicdomain/zero/1.0/">
      CC0
    </a>
    —
    <a href="https://commons.wikimedia.org/w/index.php?curid=162851361">
      Wikimedia Commons
    </a>
  </div>
    </div>
</body>
</html>
